# Bundle patch layer for orchestra-dsh.
# Applied when a profile lists this bundle (dsh plugin --profile web add orchestra-dsh).
# Two host-plane plugin rows: A2A transport + topology management, plus a
# bundle-root row that lets the client module system discover the browser
# settings panel (package-level dsh.client declaration).
- insert:
    - id: orchestra-bundle
      name: orchestra-dsh

    - id: orchestra-a2a
      name: orchestra-dsh/a2a

    - id: orchestra-manager
      name: orchestra-dsh/orchestra

# Role identity is declaration-owned in DSH 0.1.7.  The registry is host-owned;
# this bundle contributes only its named preset rows.
#
# Those rows live in ./presets/orchestra-roles.patch.yml and are declared as a
# SECOND entry of `dsh.bundle.patch` in package.json — the host loads each listed
# file as its own patch layer (the shipped @deepseek-ai/dsh-web-app bundle declares
# cordis.patch.yml + its four preset files exactly this way).
#
# They are NOT `- include:`d from here.  `include` is not a patch key: the Loader's
# applyEntryPatches destructures `{ id, insert, name, ...overrides }`, so an include
# row matches nothing, is skipped with "patch: id is required for non-insert patches",
# and the presets never reach the composed tree.
