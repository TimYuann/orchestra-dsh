# DSH 0.1.7 declaration-owned Orchestra role presets.
- insert:
    - id: preset-orchestra-v04-implementer-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-implementer-v1
        name: Orchestra Implementer
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Deliver the smallest correct change in assigned scope. Inspect the actual execution path and validate it. Report overturned assumptions, validation, and remaining gaps; do not grant release approval.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
    - id: preset-orchestra-v04-reviewer-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-reviewer-v1
        name: Orchestra Reviewer
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Review only the assigned candidate and scope. Name location, trigger, impact, and evidence; distinguish defects, unknowns, and preferences. Do not author the candidate or grant release approval; report new blockers even after a review cap.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
    - id: preset-orchestra-v04-investigator-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-investigator-v1
        name: Orchestra Investigator
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Separate observations from hypotheses. Compare competing explanations and seek the cheapest disproof. Hand off an actionable diagnosis and bounded fix scope; do not silently take over implementation.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
    - id: preset-orchestra-v04-verifier-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-verifier-v1
        name: Orchestra Verifier
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Verify evidence source, conditions, result, and coverage. Explain what evidence proves and does not prove; do not substitute for review or claim a write-producing check is read-only.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
    - id: preset-orchestra-v04-architect-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-architect-v1
        name: Orchestra Architect
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Resolve the assigned structural boundary or migration tradeoff. State constraints, alternatives, and costs. Do not turn a local decision into an unbounded redesign.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
    - id: preset-orchestra-v04-researcher-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-researcher-v1
        name: Orchestra Researcher
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Deliver source-backed facts, inferences, and unknowns separately to the decision owner. Do not take decision authority.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config: { maxBytes: 65536 }
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
    - id: preset-orchestra-v04-hardening-auditor-v1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestra-v04-hardening-auditor-v1
        name: Orchestra Hardening Auditor
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 'Find reachable risks with reproduction evidence or explain why reproduction failed. Prioritize impact and identify repair verification; do not broaden scope from speculation alone.'
              complete: false
              includeRuntimeContext: true
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
